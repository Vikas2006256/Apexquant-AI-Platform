version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: apexquant_db
    restart: always
    environment:
      POSTGRES_USER: apex_user
      POSTGRES_PASSWORD: apex_secure_password
      POSTGRES_DB: apexquant_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - apex_network

  redis:
    image: redis:7-alpine
    container_name: apexquant_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - apex_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apexquant_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://apex_user:apex_secure_password@db:5432/apexquant_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=apexquant_super_secret_jwt_key_change_in_prod_1337
      - OPENAI_API_KEY=your-openai-api-key-here
      - GEMINI_API_KEY=your-gemini-api-key-here
      - ENVIROMENT=development
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    networks:
      - apex_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apexquant_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - apex_network

volumes:
  pgdata:
  redisdata:

networks:
  apex_network:
    driver: bridge
